<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />

<body>
  <div class="nav-bar"></div>
  <div class="input-c">
    <input type="text" id="search" onkeyup="bar()" placeholder="Search games" />

      <option value="shooter">Shooter</option>
      <option value="puzzle">Puzzle</option>
      <option value="io">.io</option>

      <option value="horror">Horror</option>
      <option value="arcade">Arcade</option>
      <option value="android">Android emulator</option>
      <option value="flash">Flash</option>
      <option value="emu">Emulator</option>
      <option value="local">Local</option>
      <option value="hosted">Hosted</option>
      <option value="gn-math">GN Math</option>
    </select>
  </div>
  <div id="apps-container">
    <div class="pinned"></div>
    <h2 class="games-section" id="popular-heading">Popular</h2>
    <div class="featured"></div>
    <h2 class="games-section">All</h2>
    <div class="apps"></div>
