<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-Tac-Toe</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b0b0c; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, 88px); gap: 8px; }
    button { width: 88px; height: 88px; border: 1px solid #2a2a2e; border-radius: 12px; background: #141416; color: #fff; font-size: 36px; cursor: pointer; }
    p { margin: 0; color: #9a9a9a; font-size: 13px; }
    #reset { width: auto; height: auto; font-size: 14px; padding: 8px 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid" id="g"></div>
    <p id="status">You are X. CPU is O.</p>
    <button id="reset">New game</button>
  </div>
  <script>
    const grid = document.getElementById("g");
    const status = document.getElementById("status");
    let board = Array(9).fill("");
    let over = false;

    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function winner(b) {
      for (const [a,c,d] of lines) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
      return b.every(Boolean) ? "draw" : "";
    }
    function bestMove(b, player) {
      const opp = player === "O" ? "X" : "O";
      for (const i of [4,0,2,6,8,1,3,5,7]) if (!b[i]) {
        const copy = [...b]; copy[i] = player;
        if (winner(copy) === player) return i;
      }
      for (const i of [4,0,2,6,8,1,3,5,7]) if (!b[i]) {
        const copy = [...b]; copy[i] = opp;
        if (winner(copy) === opp) return i;
      }
      return b.findIndex((v, i) => !v && i >= 0);
    }
    function render() {
      grid.innerHTML = "";
      board.forEach((v, i) => {
        const btn = document.createElement("button");
        btn.textContent = v;
        btn.disabled = Boolean(v) || over;
        btn.onclick = () => {
          if (over || board[i]) return;
          board[i] = "X";
          const w = winner(board);
          if (w) { over = true; status.textContent = w === "draw" ? "Draw." : "You win!"; render(); return; }
          const m = bestMove(board, "O");
          if (m >= 0) board[m] = "O";
          const w2 = winner(board);
          if (w2) { over = true; status.textContent = w2 === "draw" ? "Draw." : "CPU wins."; }
          else status.textContent = "Your turn.";
          render();
        };
        grid.appendChild(btn);
      });
    }
    document.getElementById("reset").onclick = () => { board = Array(9).fill(""); over = false; status.textContent = "You are X. CPU is O."; render(); };
    render();
  </script>
</body>
</html>
