<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asteroids</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b0b0c; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    canvas { background: #141416; border: 1px solid #2a2a2e; border-radius: 12px; }
    p { margin: 0; color: #9a9a9a; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="c" width="480" height="360"></canvas>
    <p>Arrows turn/thrust, space shoots. Score: <span id="s">0</span></p>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("s");
    const ship = { x: 240, y: 180, a: 0, vx: 0, vy: 0 };
    let bullets = [], rocks = [], score = 0, keys = {};

    function spawnRock() {
      rocks.push({ x: Math.random() * 480, y: Math.random() * 360, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, r: 18 + Math.random() * 16 });
    }
    for (let i = 0; i < 6; i++) spawnRock();

    window.addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "Space") { e.preventDefault(); bullets.push({ x: ship.x, y: ship.y, vx: Math.cos(ship.a) * 6, vy: Math.sin(ship.a) * 6, life: 50 }); } });
    window.addEventListener("keyup", e => { keys[e.code] = false; });

    function wrap(o) {
      if (o.x < 0) o.x = 480; if (o.x > 480) o.x = 0;
      if (o.y < 0) o.y = 360; if (o.y > 360) o.y = 0;
    }

    function loop() {
      if (keys.ArrowLeft) ship.a -= 0.06;
      if (keys.ArrowRight) ship.a += 0.06;
      if (keys.ArrowUp) { ship.vx += Math.cos(ship.a) * 0.15; ship.vy += Math.sin(ship.a) * 0.15; }
      ship.vx *= 0.99; ship.vy *= 0.99;
      ship.x += ship.vx; ship.y += ship.vy; wrap(ship);

      bullets = bullets.filter(b => b.life-- > 0);
      for (const b of bullets) { b.x += b.vx; b.y += b.vy; wrap(b); }

      for (const r of rocks) { r.x += r.vx; r.y += r.vy; wrap(r); }

      for (const b of bullets) {
        for (let i = rocks.length - 1; i >= 0; i--) {
          const r = rocks[i];
          const dx = b.x - r.x, dy = b.y - r.y;
          if (dx * dx + dy * dy < r.r * r.r) {
            rocks.splice(i, 1);
            score += 10;
            scoreEl.textContent = score;
            spawnRock();
            break;
          }
        }
      }

      ctx.fillStyle = "#141416"; ctx.fillRect(0, 0, 480, 360);
      ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff";
      for (const r of rocks) { ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke(); }
      for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.a);
      ctx.beginPath();
      ctx.moveTo(10, 0); ctx.lineTo(-8, 6); ctx.lineTo(-5, 0); ctx.lineTo(-8, -6); ctx.closePath();
      ctx.fill();
      ctx.restore();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
